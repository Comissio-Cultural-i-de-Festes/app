name: Supabase keepalive

# Free-tier projects pause after a week without activity, and over the summer
# that will happen. A weekly authenticated read is unambiguously project
# activity, which a health endpoint may not be.
#
# The catch worth knowing: GitHub disables scheduled workflows in a public repo
# after 60 days with no commits, and emails the owner. So the thing keeping the
# database awake falls asleep first if development pauses. Treat that email as
# an action item.
#
# THE SECOND CATCH, AND IT IS SILENT. The job below is gated on the repository
# being named `Comissio-Cultural-i-de-Festes/app`. That gate is deliberate — it
# stops a fork poking somebody else's project — but it fails the wrong way:
# rename or move this repository and the job still runs, still goes green, and
# does nothing at all. There is no failure to notice, and the first sign is
# Supabase pausing the project in August.
#
# So: RENAMING THIS REPOSITORY MEANS EDITING THE LINE BELOW. Nothing else in
# the build will tell you.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    # Scheduled runs are disabled in forks by GitHub already; this covers the
    # manual trigger, so a fork cannot poke somebody else's project.
    #
    # CONFIRM BOTH HALVES when the repository is created. A wrong value makes
    # this job a silent no-op that looks exactly like a working one, and the
    # first sign is Supabase pausing the project in August.
    if: github.repository == 'Comissio-Cultural-i-de-Festes/app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: read one row through PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 30 -o /tmp/out -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/rpc/invite_preview" \
            -H 'Content-Type: application/json' \
            -d '{"p_codi":"keepalive"}')
          echo "HTTP ${status}"
          test "${status}" = "200"
