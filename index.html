<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required: without it env(safe-area-inset-*)
         resolves to 0px on iOS and every safe-area token becomes a no-op. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="%VITE_THEME_COLOR%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black`, not `black-translucent`.

         `black-translucent` asks iOS to draw the page under the status bar,
         and installed on the home screen iOS then lays its own blurred scrim
         over that band so the clock stays readable over whatever is beneath
         it. On this app that scrim covers the whole header — the wordmark, the
         greeting, the avatar — and it is pinned to the top, so scrolling does
         not move it. Verified on the device: sharp in Safari, blurred once
         installed, and the blur stays put while the content moves.

         With `black` the system owns that band and paints it, our content
         starts below it, and nothing of ours is behind the scrim. The cost is
         that the scanner's camera no longer reaches the very top of the glass.

         env(safe-area-inset-top) reports 0 in this mode, so the `--ds-safe-top`
         padding on each screen's top element becomes a no-op here and still
         does its job in Safari, where the page really does run under the
         notch. Nothing else has to change. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_SHORT_NAME%" />
    <!-- Supabase answers every request the app makes, and the first one used to
         pay DNS, TCP and TLS after the script had already run. `crossorigin`
         because supabase-js talks CORS: a preconnect without it opens a
         connection the fetch then cannot reuse. The plugin `app-comi:preconnect`
         in vite.config.ts fills in the origin, and drops both lines when the
         build has none. The origin is already in connect-src; a preconnect is
         not a fetch and CSP does not gate it. -->
    <link rel="preconnect" href="%SUPABASE_ORIGIN%" crossorigin />
    <link rel="dns-prefetch" href="%SUPABASE_ORIGIN%" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%VITE_APP_NAME%</title>
    <!-- Link preview. Crawlers run no JavaScript, so this is all they ever
         see, on every route alike: the tags are the same for / and for an
         event, which is what keeps an unrevealed event out of a preview.
         Do not make any of it per-page. The image address is made absolute
         by the `app-comi:link-preview` plugin in vite.config.ts. -->
    <meta name="description" content="%OG_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_APP_SHORT_NAME%" />
    <meta property="og:title" content="%VITE_APP_NAME%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%VITE_APP_NAME%" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
