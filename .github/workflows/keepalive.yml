name: Supabase keepalive

# Free-tier projects pause after a week without activity, and Supabase asks for
# activity every day, not every seven: a weekly ping leaves no margin for a
# single failed run. So this runs daily, against production and Staging, and
# an authenticated read is unambiguously project activity, which a health
# endpoint may not be.
#
# The URLs live in Actions *variables* and the anon keys in Actions *secrets*
# (Settings -> Secrets and variables -> Actions): SUPABASE_URL and
# SUPABASE_ANON_KEY for production, STAGING_SUPABASE_URL and
# STAGING_SUPABASE_ANON_KEY for Staging. An empty one fails the job naming it,
# instead of a curl error about a URL with no host. The two projects are
# separate matrix entries with fail-fast off, so one being down never skips
# the other, and the run turns red showing which one.
#
# The keys are not in the matrix because `secrets` is not available in
# `strategy` (only github, needs, vars and inputs are). Both reach the step and
# the script picks by project. A `cond && a || b` expression would be shorter
# but falls through to the other project's key when the chosen one is empty,
# so a missing Staging key would ping Staging with production's and go green.
#
# The catch worth knowing: GitHub disables scheduled workflows in a public repo
# after 60 days with no commits, and emails the owner. So the thing keeping the
# database awake falls asleep first if development pauses. Treat that email as
# an action item.
#
# THE SECOND CATCH, AND IT IS SILENT. The job below is gated on the repository
# being named `Comissio-Cultural-i-de-Festes/app`. That gate is deliberate — it
# stops a fork poking somebody else's project — but it fails the wrong way:
# rename or move this repository and the job still runs, still goes green, and
# does nothing at all. There is no failure to notice, and the first sign is
# Supabase pausing the project in August.
#
# So: RENAMING THIS REPOSITORY MEANS EDITING THE `if:` OF THE `ping` JOB. Nothing else in
# the build will tell you.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    # Scheduled runs are disabled in forks by GitHub already; this covers the
    # manual trigger, so a fork cannot poke somebody else's project.
    #
    # CONFIRM BOTH HALVES when the repository is created. A wrong value makes
    # this job a silent no-op that looks exactly like a working one, and the
    # first sign is Supabase pausing the project in August.
    if: github.repository == 'Comissio-Cultural-i-de-Festes/app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: production
            url_name: SUPABASE_URL
            key_name: SUPABASE_ANON_KEY
            url: ${{ vars.SUPABASE_URL }}
          - project: staging
            url_name: STAGING_SUPABASE_URL
            key_name: STAGING_SUPABASE_ANON_KEY
            url: ${{ vars.STAGING_SUPABASE_URL }}
    name: ping (${{ matrix.project }})
    steps:
      - name: read one row through PostgREST
        env:
          PROJECT: ${{ matrix.project }}
          URL_NAME: ${{ matrix.url_name }}
          KEY_NAME: ${{ matrix.key_name }}
          SUPABASE_URL: ${{ matrix.url }}
          PRODUCTION_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STAGING_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ "${PROJECT}" = staging ]; then
            SUPABASE_ANON_KEY="${STAGING_KEY}"
          else
            SUPABASE_ANON_KEY="${PRODUCTION_KEY}"
          fi
          if [ -z "${SUPABASE_URL//[[:space:]]/}" ]; then
            echo "::error::Actions variable ${URL_NAME} is empty or missing (${PROJECT})"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY//[[:space:]]/}" ]; then
            echo "::error::Actions secret ${KEY_NAME} is empty or missing (${PROJECT})"
            exit 1
          fi
          status=$(curl -sS --max-time 30 -o /tmp/out -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/rpc/invite_preview" \
            -H 'Content-Type: application/json' \
            -d '{"p_codi":"keepalive"}')
          echo "${PROJECT}: HTTP ${status}"
          if [ "${status}" != "200" ]; then
            head -c 300 /tmp/out
            echo
            exit 1
          fi
